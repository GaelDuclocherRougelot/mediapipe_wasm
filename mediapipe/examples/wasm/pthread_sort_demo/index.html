<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Parallel sort proof of concept (-pthread)</title>
  </head>
  <body>
    <p>
      Sorts the same random int array single-threaded (baseline) and
      multi-threaded (N real std::thread, each sorting its own slice of one
      shared std::vector via Emscripten -pthread, then merged).
    </p>
    <p>
      Array size:
      <input id="size" type="number" value="20000000" style="width: 10em" />
    </p>
    <p>
      Threads:
      <input id="threads" type="number" value="8" style="width: 4em" />
      (navigator.hardwareConcurrency = <span id="cores"></span>)
    </p>
    <button id="run" disabled>Loading module...</button>
    <pre id="output"></pre>

    <script src="pthread_sort_demo.js"></script>
    <script>
      document.getElementById("cores").textContent = navigator.hardwareConcurrency;

      const runButton = document.getElementById("run");
      const outputEl = document.getElementById("output");
      let Module = null;

      PthreadSortDemoModule().then((m) => {
        Module = m;
        runButton.disabled = false;
        runButton.textContent = "Run benchmark";
      });

      runButton.addEventListener("click", () => {
        const size = parseInt(document.getElementById("size").value, 10);
        const numThreads = parseInt(document.getElementById("threads").value, 10);
        runButton.disabled = true;
        runButton.textContent = "Running...";
        outputEl.textContent = "";
        // Yield one frame so the button's disabled state paints before the
        // (synchronous, main-thread) benchmark blocks the page.
        requestAnimationFrame(() => {
          const bench = new Module.SortBenchmark();
          const result = bench.runBenchmark(size, numThreads);
          outputEl.textContent = result;
          runButton.disabled = false;
          runButton.textContent = "Run benchmark";
        });
      });
    </script>
  </body>
</html>
